<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<meta name="description" content="CLONE! - jogo de ação estilo Cuphead sobre clonagem celular, mitose e DNA.">
<title>CLONE! — A Batalha do Núcleo</title>

<!-- instalável no celular (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLONE!">

<link rel="stylesheet" href="css/style.css?v=18">
</head>
<body>

<div id="shell">
  <div id="stage">
    <canvas id="game" width="640" height="360"></canvas>

    <!-- ====== CONTROLES DE TOQUE (celular / tablet) ====== -->
    <div id="touch" class="hidden">
      <!-- analogico da esquerda: andar -->
      <div class="stick-zone left" id="zone-move">
        <div class="stick-hint">MOVER</div>
        <div class="stick-base"></div>
        <div class="stick-knob"></div>
      </div>

      <!-- analogico da direita: mirar e atirar -->
      <div class="stick-zone right" id="zone-aim">
        <div class="stick-hint">MIRAR E ATIRAR</div>
        <div class="stick-base"></div>
        <div class="stick-knob"></div>
      </div>

      <!-- botoes de acao, embaixo do lado direito, junto do analogico -->
      <div class="cluster">
        <button class="tbtn act a-super" data-act="super" aria-label="Super">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13 2 L5 14 H10.5 L9 22 L19 9 H13 Z"/>
          </svg>
        </button>
        <button class="tbtn act a-dash" data-act="dash" aria-label="Correr">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="ln" d="M4 12 H17 M12.5 7 L17.5 12 L12.5 17 M2 7.5 H7 M2 16.5 H7"/>
          </svg>
        </button>
        <button class="tbtn act a-jump" data-act="jump" aria-label="Pular">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="ln" d="M12 4 V16 M7 9 L12 4 L17 9 M4 20 H20"/>
          </svg>
        </button>
      </div>

      <button id="btn-pause" class="tbtn sys" data-act="pause" aria-label="Pausar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="ln" d="M9 6 V18 M15 6 V18"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="rotate" class="hidden">
    <div class="rot-inner">
      <div class="rot-icon">📱</div>
      <p>Vire o celular na horizontal<br>para jogar!</p>
    </div>
  </div>
</div>

<script src="js/input.js?v=18" charset="utf-8"></script>
<script src="js/audio.js?v=18" charset="utf-8"></script>
<script src="js/art.js?v=18" charset="utf-8"></script>
<script src="js/shop.js?v=18" charset="utf-8"></script>
<script src="js/entities.js?v=18" charset="utf-8"></script>
<script src="js/boss.js?v=18" charset="utf-8"></script>
<script src="js/map.js?v=18" charset="utf-8"></script>
<script src="js/game.js?v=18" charset="utf-8"></script>

<script>
/* registra o service worker (deixa o jogo instalável e offline) */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
