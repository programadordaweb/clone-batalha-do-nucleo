<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<meta name="description" content="CLONE! - jogo de ação estilo Cuphead sobre clonagem celular, mitose e DNA.">
<title>CLONE! — A Batalha do Núcleo</title>

<!-- instalável no celular (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLONE!">

<link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>

<div id="shell">
  <div id="stage">
    <canvas id="game" width="640" height="360"></canvas>

    <!-- ====== CONTROLES DE TOQUE (celular / tablet) ====== -->
    <div id="touch" class="hidden">
      <!-- analogico da esquerda: andar -->
      <div class="stick-zone left" id="zone-move">
        <div class="stick-hint">MOVER</div>
        <div class="stick-base"></div>
        <div class="stick-knob"></div>
      </div>

      <!-- analogico da direita: mirar e atirar -->
      <div class="stick-zone right" id="zone-aim">
        <div class="stick-hint">MIRAR E ATIRAR</div>
        <div class="stick-base"></div>
        <div class="stick-knob"></div>
      </div>

      <!-- botoes de ombro, na borda de cima -->
      <button class="tbtn sh sh-super" data-act="super" aria-label="Super"><span>SUPER</span></button>
      <button class="tbtn sh sh-dash"  data-act="dash"  aria-label="Correr"><span>DASH</span></button>
      <button class="tbtn sh sh-jump"  data-act="jump"  aria-label="Pular"><span>PULO</span></button>

      <button id="btn-pause" class="tbtn sys" data-act="pause" aria-label="Pausar"><span>II</span></button>
    </div>
  </div>

  <div id="rotate" class="hidden">
    <div class="rot-inner">
      <div class="rot-icon">📱</div>
      <p>Vire o celular na horizontal<br>para jogar!</p>
    </div>
  </div>
</div>

<script src="js/input.js?v=15" charset="utf-8"></script>
<script src="js/audio.js?v=15" charset="utf-8"></script>
<script src="js/art.js?v=15" charset="utf-8"></script>
<script src="js/shop.js?v=15" charset="utf-8"></script>
<script src="js/entities.js?v=15" charset="utf-8"></script>
<script src="js/boss.js?v=15" charset="utf-8"></script>
<script src="js/map.js?v=15" charset="utf-8"></script>
<script src="js/game.js?v=15" charset="utf-8"></script>

<script>
/* registra o service worker (deixa o jogo instalável e offline) */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
